<div class="stat-card" [class]="colorClass() + ' ' + glowClass()">
  <div class="stat-icon">{{ icon() }}</div>
  <div class="stat-value" [class]="valueClass()">{{ value() }}</div>
  <div class="stat-label">{{ label() }}</div>
  @if (badge()) {
    <div class="stat-badge" [ngStyle]="badgeStyle()">{{ badge() }}</div>
  }
</div>
