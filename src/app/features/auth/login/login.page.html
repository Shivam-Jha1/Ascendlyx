<div class="login-screen">
  <!-- Left panel — branding + illustration -->
  <div class="login-left">
    <div class="ll-brand">Ascendlyx</div>
    <div class="ll-tagline">Build your streak. Reach your peak.</div>

    <!-- SVG Illustration -->
    <div class="ll-illustration">
      <svg width="360" height="320" viewBox="0 0 360 320" fill="none" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="g1" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#6C63FF"/>
            <stop offset="100%" stop-color="#00C2FF"/>
          </linearGradient>
          <radialGradient id="glow1" cx="50%" cy="50%" r="50%">
            <stop offset="0%" stop-color="#6C63FF" stop-opacity="0.3"/>
            <stop offset="100%" stop-color="#6C63FF" stop-opacity="0"/>
          </radialGradient>
        </defs>
        <ellipse cx="180" cy="160" rx="140" ry="120" fill="url(#glow1)"/>
        <circle cx="180" cy="160" r="80" stroke="url(#g1)" stroke-width="1.5" fill="none" opacity="0.4"/>
        <circle cx="180" cy="160" r="110" stroke="url(#g1)" stroke-width="0.7" fill="none" opacity="0.2" stroke-dasharray="5 8"/>
        <polyline points="60,220 100,190 140,200 180,150 220,130 260,100 300,80" stroke="url(#g1)" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
        <circle cx="100" cy="190" r="5" fill="#6C63FF" opacity="0.8"/>
        <circle cx="180" cy="150" r="5" fill="#6C63FF" opacity="0.8"/>
        <circle cx="260" cy="100" r="5" fill="#00C2FF" opacity="0.8"/>
        <circle cx="300" cy="80" r="7" fill="url(#g1)"/>
        <polygon points="60,220 100,190 140,200 180,150 220,130 260,100 300,80 300,260 60,260" fill="url(#g1)" opacity="0.07"/>
        <!-- Floating cards -->
        <rect x="30" y="40" width="100" height="52" rx="12" fill="#1a2236" stroke="rgba(108,99,255,0.3)" stroke-width="1"/>
        <text x="44" y="62" font-size="11" fill="#8892A4" font-family="sans-serif">Today's Streak</text>
        <text x="44" y="82" font-size="18" font-weight="bold" fill="#FFA500" font-family="sans-serif">🔥 42 days</text>
        <rect x="230" y="220" width="110" height="52" rx="12" fill="#1a2236" stroke="rgba(0,194,255,0.3)" stroke-width="1"/>
        <text x="244" y="242" font-size="11" fill="#8892A4" font-family="sans-serif">AI Score</text>
        <text x="244" y="262" font-size="18" font-weight="bold" fill="#00C2FF" font-family="sans-serif">⚡ 94/100</text>
        <rect x="130" y="10" width="95" height="46" rx="10" fill="#1a2236" stroke="rgba(34,197,94,0.3)" stroke-width="1"/>
        <text x="143" y="31" font-size="10" fill="#8892A4" font-family="sans-serif">Goals Done</text>
        <text x="143" y="48" font-size="16" font-weight="bold" fill="#22C55E" font-family="sans-serif">✓ 8/10</text>
        <!-- Stars -->
        <circle cx="50" cy="160" r="2" fill="white" opacity="0.3"/>
        <circle cx="330" cy="50" r="2" fill="white" opacity="0.4"/>
        <circle cx="20" cy="280" r="1.5" fill="white" opacity="0.3"/>
        <circle cx="340" cy="200" r="1.5" fill="white" opacity="0.25"/>
      </svg>
    </div>

    <div class="ll-social-proof">
      Join <strong>28,000+</strong> people building their best habits
    </div>
  </div>

  <!-- Right panel — login form -->
  <div class="login-right">
    <div class="login-form-box">
      <h1 class="lf-title">Welcome back 👋</h1>
      <p class="lf-sub">Sign in to continue your streak</p>

      @if (errorMessage) {
        <div class="alert alert-danger py-2 px-3" style="font-size: 13px; border-radius: 10px;">
          {{ errorMessage }}
        </div>
      }

      <form (ngSubmit)="onSubmit()">
        <div class="mb-3">
          <label class="form-label">Email address</label>
          <input
            type="email"
            class="form-control"
            placeholder="you&#64;example.com"
            [(ngModel)]="email"
            name="email"
            autocomplete="email"
          />
        </div>

        <div class="mb-3">
          <label class="form-label">Password</label>
          <input
            type="password"
            class="form-control"
            placeholder="••••••••••"
            [(ngModel)]="password"
            name="password"
            autocomplete="current-password"
          />
        </div>

        <div class="text-end mb-3">
          <a class="forgot-link">Forgot password?</a>
        </div>

        <button type="submit" class="btn-grad" [disabled]="isLoading">
          @if (isLoading) {
            <span class="spinner-border spinner-border-sm me-2"></span>
          }
          Sign In
        </button>
      </form>

      <div class="divider-or">or continue with</div>

      <button class="btn-ghost" (click)="loginWithGoogle()">
        <svg width="18" height="18" viewBox="0 0 24 24">
          <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
          <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
          <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/>
          <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
        </svg>
        Continue with Google
      </button>

      <p class="lf-link">
        Don't have an account? <a routerLink="/signup">Sign Up</a>
      </p>

      <div class="lf-footer">Stay consistent. Build your peak.</div>
    </div>
  </div>
</div>
